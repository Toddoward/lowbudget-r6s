# Matchmaking / relay backend (Cloudflare Workers + Durable Objects).
# Deploy:  npx wrangler deploy -c worker/wrangler.toml
name = "r6-matchmaker"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]   # SQLite-backed DO — required on the Workers Free plan

[observability]
enabled = true
